name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve and who is affected?
      placeholder: Describe the user need, workflow, or limitation.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior, key requirements, and expected outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other approaches considered and relevant trade-offs.
    validations:
      required: false
