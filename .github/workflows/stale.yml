name: Manage stale issues and pull requests

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close inactive conversations
    runs-on: ubuntu-latest
    steps:
      - name: Review inactivity
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security
          stale-issue-message: "Thanks for reporting this. This issue has had no activity for 60 days, so it has been marked as stale. Please comment with an update to keep it open; otherwise it will close in 14 days."
          stale-pr-message: "Thanks for contributing. This pull request has had no activity for 60 days, so it has been marked as stale. Please comment or push an update to keep it open; otherwise it will close in 14 days."
          close-issue-message: "This issue has been closed after 14 additional days without activity. Thank you for contributing; feel free to reopen it with new information."
          close-pr-message: "This pull request has been closed after 14 additional days without activity. Thank you for your work; feel free to reopen it when it is ready for further review."
