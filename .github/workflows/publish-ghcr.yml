name: Publish Backend to GHCR

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push backend image
    runs-on: ubuntu-latest
    steps:
      - name: Check out release revision
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine release image tags
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a semantic version (for example, 1.0.0 or v1.0.0)"
            exit 1
          fi
          # OCI tags cannot contain '+'; use an underscore for build metadata.
          VERSION="${VERSION//+/_}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/aliabba3i/ridehailing-platform:latest
            ghcr.io/aliabba3i/ridehailing-platform:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/aliabba3i/ridehailing-platform
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=RideHailing backend API
          cache-from: type=gha
          cache-to: type=gha,mode=max
