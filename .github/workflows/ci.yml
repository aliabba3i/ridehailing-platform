name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    name: build-and-test (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @ride/shared
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: npm run typecheck
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_ACCESS_SECRET: ci_test_access_secret_not_for_production_12345
          JWT_REFRESH_SECRET: ci_test_refresh_secret_not_for_production_12345
      - run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_ACCESS_SECRET: ci_test_access_secret_not_for_production_12345
          JWT_REFRESH_SECRET: ci_test_refresh_secret_not_for_production_12345
      - run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_ACCESS_SECRET: ci_test_access_secret_not_for_production_12345
          JWT_REFRESH_SECRET: ci_test_refresh_secret_not_for_production_12345

  backend-docker-build:
    name: backend-docker-build (Node.js 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build --file backend/Dockerfile --tag ridehailing-backend:ci .
